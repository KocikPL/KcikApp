<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kcik's apps</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #222;
            line-height: 1.5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 640px;
            margin: 60px auto;
            padding: 40px 20px;
            text-align: center;
        }
        h2.site-title {
            font-size: 32px;
            color: #1a1a1a;
            margin-bottom: 6px;
            font-weight: 600;
        }
        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 8px;
            font-weight: 600;
        }
        p.subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
        }
        .btn-download {
            display: inline-block;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #2d8f4f;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-download:hover {
            background-color: #267a44;
        }
        .btn-download:active {
            background-color: #1f6a37;
        }
        .file-note {
            margin-top: 32px;
            font-size: 14px;
            color: #555;
        }
        .file-path {
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            background: #eef0f3;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 8px;
            color: #444;
            word-break: break-all;
        }
        .separator {
            margin: 24px 0;
            border-top: 1px solid #ddd;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="site-title">Kcik's apps</h2>
        <h1>Kcik's workplace for Python</h1>
        <p class="subtitle">Simple Python code editor &mdash; run scripts, edit files, and see output in one window.</p>

        <a class="btn-download" href="C:\\Users\\kocik\\Desktop\\Kcik's workplace.exe">Download Kcik's workplace.exe</a>

        <div class="separator"></div>

        <p class="subtitle" style="font-size: 13px;">
            Built with Python &amp; tkinter &middot; Lightweight editor for personal use
        </p>
    </div>
</body>
</html>
